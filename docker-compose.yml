services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpnno10/vpner-api:6747706933
    container_name: vpner-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - upload_data:/app/upload
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      # Enable together with the TLS directives in nginx/conf.d/default.conf.
      # - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: just_vpn.303
      TZ: Asia/Shanghai
    ports:
      - "16379:6379"
    command:
      [
        "sh",
        "-c",
        "redis-server --requirepass \"just_vpn.303\" --appendonly yes --appendfsync everysec --maxmemory 3gb --maxmemory-policy allkeys-lru --timeout 0 --tcp-keepalive 300",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"just_vpn.303\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  redis_data:
  upload_data:
