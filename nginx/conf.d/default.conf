server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # To enable HTTPS, set server_name to your domain, provide the certificate
    # files below, uncomment these directives and publish port 443 in Compose.
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 20m;

    # Checks nginx itself; application readiness is separate.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Preserve the complete API path, including /relayjet/v1/common/.
    # /relayjet/v1/common/autolog -> app:8080/relayjet/v1/common/autolog
    location ^~ /newsconns/ {
        # Docker DNS allows app to be recreated without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_backend app:8080;
        proxy_pass http://$app_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Also match /index.html after the index module's internal redirect.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}
